---
hostname: rancher.dev.lsst.org
ingress:
  enabled: true
  ingressClassName: nginx
  tls:
    source: secret
  extraAnnotations:
    cert-manager.io/cluster-issuer: letsencrypt
extraEnv:
  # version strings from https://github.com/rancher/rancher/blob/v2.14.3/build.yaml (fleetVersion)
  - name: CATTLE_FLEET_MIN_VERSION
    value: 109.0.4+up0.15.4
