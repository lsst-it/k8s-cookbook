---
hostname: rancher.dev.lsst.org
ingress:
  enabled: true
  ingressClassName: nginx
  tls:
    source: secret
  extraAnnotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # Rancher >= 2.14 no longer sets these on its Ingress; keep long UI websockets (kubectl shell, logs) open
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
extraEnv:
  # Fleet 0.15.9 instead of the 0.15.4 bundled with Rancher 2.14.3 (security fixes and the
  # webhook caBundle drift fix). Remove at the next Rancher upgrade: while set, it overrides
  # the Fleet version that Rancher bundles.
  - name: CATTLE_FLEET_MIN_VERSION
    value: 109.0.9+up0.15.9
