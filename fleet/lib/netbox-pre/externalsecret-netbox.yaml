---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox-keycloak-client-dev
  namespace: netbox
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: netbox-keycloak-client-dev
    template:
      engineVersion: v2
      data:
        oidc-keycloak.yaml: |
          SOCIAL_AUTH_KEYCLOAK_KEY:               "{{ .client_id }}"
          SOCIAL_AUTH_KEYCLOAK_SECRET:            "{{ .client_secret }}"
          SOCIAL_AUTH_KEYCLOAK_PUBLIC_KEY:        "{{ .public_key }}"
          SOCIAL_AUTH_KEYCLOAK_AUTHORIZATION_URL: "{{ .authorization_url }}"
          SOCIAL_AUTH_KEYCLOAK_ACCESS_TOKEN_URL:  "{{ .token_url }}"
  data:
    - secretKey: client_id
      remoteRef:
        key: netbox-keycloak-client-dev
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: netbox-keycloak-client-dev
        property: client_secret
    - secretKey: public_key
      remoteRef:
        key: netbox-keycloak-client-dev
        property: public_key
    - secretKey: authorization_url
      remoteRef:
        key: netbox-keycloak-client-dev
        property: authorization_url
    - secretKey: token_url
      remoteRef:
        key: netbox-keycloak-client-dev
        property: token_url