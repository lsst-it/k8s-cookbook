---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox-superuser
  namespace: netbox
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: netbox-superuser
  data:
    - secretKey: password
      remoteRef:
        key: netbox-superuser
        property: password
    - secretKey: api_token
      remoteRef:
        key: netbox-superuser
        property: token
