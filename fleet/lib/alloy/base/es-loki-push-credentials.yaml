---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-push-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: loki-push-credentials
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: loki-alloy-push
        property: username
    - secretKey: password
      remoteRef:
        key: loki-alloy-push
        property: password
