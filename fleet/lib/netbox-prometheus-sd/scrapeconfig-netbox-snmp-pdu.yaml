---
# Poll the active PDUs that NetBox knows over SNMP (raritan: inlet, outlet and external sensor
# measurements), like blackbox-snmp-raritan-pdu does from the hand-kept list. New job name;
# compare by instance. Every 5m instead of 1m: a PDU takes ~13s to answer and is already polled
# by four Prometheus. TemperatureHigh/Critical have no job filter, but ruka has no
# prometheus-alerts, so they aren't evaluated here.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: netbox-snmp-pdu
  namespace: kube-prometheus-stack
  labels:
    lsst.io/scrape: "true"
spec:
  jobName: netbox-snmp-pdu
  scrapeInterval: 5m
  scrapeTimeout: 55s
  metricsPath: /snmp
  params:
    module: [raritan]
    auth: [rubin_v2]
  httpSDConfigs:
    # in-cluster NetBox (netbox-chart service); the endpoint returns every match, no pagination
    - url: http://netbox.netbox.svc.cluster.local/api/plugins/prometheus-sd/devices/?status=active&role=pdu
      refreshInterval: 5m
      authorization:
        type: Bearer
        credentials:
          name: netbox-prometheus-sd
          key: token
  relabelings:
    # the plugin's target is the device name; poll its primary IPv4 (a bare address), and skip
    # devices without one (keep, not drop on "": the operator omits an empty regex, and the
    # default (.*) would then drop every target)
    - sourceLabels: [__meta_netbox_primary_ip4]
      regex: (.+)
      action: keep
    - sourceLabels: [__meta_netbox_primary_ip4]
      targetLabel: __param_target
    # the polled address as a visible label, to compare with the hand-kept lists in PromQL
    # (probe_ip_addr_hash only says whether two jobs ping the same address)
    - sourceLabels: [__meta_netbox_primary_ip4]
      targetLabel: target_ip
    # instance = FQDN, as in the hand-kept lists: a short name + the site's domain (a name that
    # already has a dot is kept as it is)
    - sourceLabels: [__meta_netbox_name]
      targetLabel: instance
    - sourceLabels: [__meta_netbox_site_slug, __meta_netbox_name]
      regex: bdc;([^.]+)
      replacement: ${1}.ls.lsst.org
      targetLabel: instance
    - sourceLabels: [__meta_netbox_site_slug, __meta_netbox_name]
      regex: sdc;([^.]+)
      replacement: ${1}.cp.lsst.org
      targetLabel: instance
    - sourceLabels: [__meta_netbox_role_slug]
      targetLabel: role
    - sourceLabels: [__meta_netbox_site_slug]
      targetLabel: site
    - targetLabel: __address__
      replacement: prometheus-snmp-exporter.snmp-exporter:9116
