---
# Trial of NetBox as Prometheus's inventory (netbox-plugin-prometheus-sd): ICMP and SNMP of the
# active network devices and PDUs, under new job names next to the hand-kept jobs. Deployed on
# ruka only (no prometheus-alerts there, so nothing pages).
defaultNamespace: kube-prometheus-stack
labels:
  bundle: netbox-prometheus-sd
helm:
  releaseName: netbox-prometheus-sd
  timeoutSeconds: 300
  waitForJobs: true
dependsOn:
  - selector:
      matchLabels:
        bundle: external-secrets
  - selector:
      matchLabels:
        bundle: kube-prometheus-stack
  - selector:
      matchLabels:
        bundle: netbox
  - selector:
      matchLabels:
        bundle: blackbox-exporter
  - selector:
      matchLabels:
        bundle: snmp-exporter
