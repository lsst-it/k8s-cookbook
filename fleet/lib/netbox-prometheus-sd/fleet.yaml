---
defaultNamespace: kube-prometheus-stack
labels:
  bundle: netbox-prometheus-sd
helm:
  releaseName: netbox-prometheus-sd
  timeoutSeconds: 300
  waitForJobs: true
dependsOn:
  - selector:
      matchLabels:
        bundle: external-secrets
  - selector:
      matchLabels:
        bundle: kube-prometheus-stack
  - selector:
      matchLabels:
        bundle: netbox
  - selector:
      matchLabels:
        bundle: blackbox-exporter
  - selector:
      matchLabels:
        bundle: snmp-exporter
