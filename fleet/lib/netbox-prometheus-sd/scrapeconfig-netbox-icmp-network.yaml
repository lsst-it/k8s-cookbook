---
# Ping the active leafs and spines that NetBox knows, through the blackbox exporter, like
# blackbox-icmp-snmp does from the hand-kept list (kube-prometheus-stack overlays/dev). New job
# name, so HostDown and the dashboards filtering on blackbox-icmp-snmp don't pick it up; compare
# the two jobs by instance in PromQL.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: netbox-icmp-network
  namespace: kube-prometheus-stack
  labels:
    lsst.io/scrape: "true"
spec:
  jobName: netbox-icmp-network
  scrapeInterval: 1m
  scrapeTimeout: 30s
  metricsPath: /probe
  params:
    module: [icmp]
  httpSDConfigs:
    # in-cluster NetBox (netbox-chart service); the endpoint returns every match, no pagination
    - url: http://netbox.netbox.svc.cluster.local/api/plugins/prometheus-sd/devices/?status=active&role=leaf&role=spine
      refreshInterval: 5m
      authorization:
        type: Bearer
        credentials:
          name: netbox-prometheus-sd
          key: token
  relabelings:
    # the plugin's target is the device name; ping its primary IPv4 (a bare address), and skip
    # devices without one (keep, not drop on "": the operator omits an empty regex, and the
    # default (.*) would then drop every target)
    - sourceLabels: [__meta_netbox_primary_ip4]
      regex: (.+)
      action: keep
    - sourceLabels: [__meta_netbox_primary_ip4]
      targetLabel: __param_target
    # instance = FQDN, as in the hand-kept lists: name + the site's domain
    - sourceLabels: [__meta_netbox_name]
      targetLabel: instance
    - sourceLabels: [__meta_netbox_site_slug, __meta_netbox_name]
      regex: bdc;(.+)
      replacement: ${1}.ls.lsst.org
      targetLabel: instance
    - sourceLabels: [__meta_netbox_site_slug, __meta_netbox_name]
      regex: sdc;(.+)
      replacement: ${1}.cp.lsst.org
      targetLabel: instance
    - sourceLabels: [__meta_netbox_role_slug]
      targetLabel: role
    - sourceLabels: [__meta_netbox_site_slug]
      targetLabel: site
    - targetLabel: __address__
      replacement: prometheus-blackbox-exporter.blackbox-exporter:9115
