---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox-prometheus-sd
  namespace: kube-prometheus-stack
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: netbox-prometheus-sd
  data:
    - secretKey: token
      remoteRef:
        key: netbox-prometheus-sd
        property: password
