---
# The v2 API token of NetBox's local, view-only user prometheus-sd (created in the NetBox UI;
# 1Password item netbox-prometheus-sd, the token in its password field).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox-prometheus-sd
  namespace: kube-prometheus-stack
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: netbox-prometheus-sd
  data:
    - secretKey: token
      remoteRef:
        key: netbox-prometheus-sd
        property: password
