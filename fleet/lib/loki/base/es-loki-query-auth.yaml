---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-query-auth
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: loki-query-auth
  data:
    - secretKey: auth
      remoteRef:
        key: loki-query-auth
        property: auth
