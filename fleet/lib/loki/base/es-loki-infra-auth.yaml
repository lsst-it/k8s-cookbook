---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-infra-auth
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: loki-infra-auth
  data:
    - secretKey: auth
      remoteRef:
        key: loki-infra-auth
        property: auth
