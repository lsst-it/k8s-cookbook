---
deploymentMode: Distributed

gateway:
  enabled: true
  replicas: 3
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      nginx.ingress.kubernetes.io/backend-protocol: HTTP
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
      nginx.ingress.kubernetes.io/client-body-buffer-size: 10m
      nginx.ingress.kubernetes.io/auth-type: basic
      nginx.ingress.kubernetes.io/auth-secret: loki-infra-auth
      nginx.ingress.kubernetes.io/auth-realm: Loki

    hosts:
      - host: loki.${ .ClusterLabels.site }.lsst.org
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: tls-loki-ingress
        hosts:
          - loki.${ .ClusterLabels.site }.lsst.org

global:
  dnsService: rke2-coredns-rke2-coredns
  extraEnv:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: rook-ceph-object-user-o11y-loki
          key: AccessKey
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: rook-ceph-object-user-o11y-loki
          key: SecretKey

loki:
  auth_enabled: false
  ingester:
    chunk_idle_period: 10m
    max_chunk_age: 1h
  commonConfig:
    replication_factor: 3

  storage:
    type: s3
    s3:
      endpoint: http://rook-ceph-rgw-o11y.rook-ceph.svc.cluster.local
      region: o11y
      s3ForcePathStyle: true
    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
      admin: loki-admin

  schemaConfig:
    configs:
      - from: "2025-03-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  compactor:
    retention_enabled: true
    working_directory: /var/loki/compactor
    delete_request_store: s3

  query_range:
    cache_results: true
    results_cache:
      cache:
        enable_fifocache: false
        memcached:
          addresses: dns+loki-results-cache.loki.svc.cluster.local:11211
          max_item_size: 1MiB
          timeout: 500ms

  limits_config:
    retention_period: 90d
    ingestion_rate_mb: 150
    ingestion_burst_size_mb: 300
    per_stream_rate_limit: 10MB
    per_stream_rate_limit_burst: 20MB
    max_global_streams_per_user: 500000
    max_label_names_per_series: 30
    reject_old_samples_max_age: 168h
    query_timeout: 4m
    max_entries_limit_per_query: 100000

distributor:
  replicas: 3
  maxUnavailable: 1
  resources:
    requests: { cpu: 2, memory: 1Gi }
    limits: { cpu: 4, memory: 2Gi }

ingester:
  replicas: 6
  maxUnavailable: 1
  persistence:
    enabled: true
    claims:
      - name: data
        accessModes:
          - ReadWriteOnce
        size: 60Gi
  resources:
    requests: { cpu: 4, memory: 8Gi }
    limits: { cpu: 8, memory: 16Gi }

querier:
  replicas: 4
  maxUnavailable: 2
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: 4, memory: 4Gi }

queryFrontend:
  replicas: 3
  maxUnavailable: 1
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: 2, memory: 2Gi }

queryScheduler:
  replicas: 3
  maxUnavailable: 1
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: 2, memory: 2Gi }

compactor:
  replicas: 1
  persistence:
    enabled: true
    storageClassName: rook-ceph-block
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: 2, memory: 4Gi }

indexGateway:
  replicas: 3
  maxUnavailable: 1
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: 2, memory: 4Gi }

resultsCache:
  enabled: true
  replicas: 3
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { cpu: 1, memory: 1Gi }

chunksCache:
  enabled: true
  replicas: 3
  resources:
    requests: { cpu: 200m, memory: 1Gi }
    limits: { cpu: 1, memory: 4Gi }

# needed by helm
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

monitoring:
  serviceMonitor:
    enabled: true
    labels:
      lsst.io/monitor: "true"

extraObjects:
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: loki-query
      namespace: loki
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        nginx.ingress.kubernetes.io/backend-protocol: HTTP
        nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
        nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
        nginx.ingress.kubernetes.io/auth-type: basic
        nginx.ingress.kubernetes.io/auth-secret: loki-query-auth
        nginx.ingress.kubernetes.io/auth-realm: loki-query
        nginx.ingress.kubernetes.io/server-snippet: |
          location ~ ^/loki/api/v1/(push|flush|reload) {
            return 403;
          }
    spec:
      ingressClassName: nginx
      rules:
        - host: loki-query.${ .ClusterLabels.site }.lsst.org
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: loki-gateway
                    port:
                      number: 80
      tls:
        - secretName: tls-loki-query-ingress
          hosts:
            - loki-query.${ .ClusterLabels.site }.lsst.org
