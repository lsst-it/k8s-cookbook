---
kube-state-metrics:
  resources:
    limits:
      cpu: 100m
      memory: 1Gi
    requests:
      cpu: 10m
      memory: 512Mi
prometheus:
  prometheusSpec:
    retentionSize: 140GB
    storageSpec:
      volumeClaimTemplate:
        metadata:
          name: prometheus-db-machi
        spec:
          resources:
            requests:
              storage: 200Gi
