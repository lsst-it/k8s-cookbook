---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: checknorris-slack
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: checknorris-slack
  data:
    - secretKey: SLACK_BOT_TOKEN
      remoteRef:
        key: checknorris-slack
        property: bot-token
    - secretKey: SLACK_APP_TOKEN
      remoteRef:
        key: checknorris-slack
        property: app-token
