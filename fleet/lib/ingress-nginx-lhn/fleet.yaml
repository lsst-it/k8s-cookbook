---
defaultNamespace: &name ingress-nginx-lhn
namespaceLabels:
  lsst.io/discover: "true"
labels:
  bundle: *name
helm:
  chart: ingress-nginx
  releaseName: *name
  repo: https://kubernetes.github.io/ingress-nginx
  version: 4.15.1
  values:
    controller:
      kind: DaemonSet
      allowSnippetAnnotations: true
      image:
        registry: ghcr.io
        image: lsst-sqre/ingress-nginx-controller
        tag: v1.15.15-lsstsqre-chainguard
        digest: sha256:e026f52ee5ed2b90def28591972e7bbfc64bceb52c2d059d7a5bc36b7c94639c
        digestChroot: sha256:943785844831cbe0176215cd880b9855085f7824d77c4f26d2c5b56c5b399494
        pullPolicy: IfNotPresent
      ingressClass: nginx-lhn
      ingressClassByName: true
      ingressClassResource:
        name: nginx-lhn
        enabled: true
        controllerValue: k8s.io/ingress-nginx-lhn
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          additionalLabels:
            lsst.io/monitor: "true"
        prometheusRule:
          enabled: false
          additionalLabels:
            lsst.io/rule: "true"
    rbac:
      create: true
  timeoutSeconds: 60
  waitForJobs: true
targetCustomizations:
  - name: default
    clusterSelector:
      matchLabels:
      matchExpressions:
        - key: site
          operator: In
          values:
            - dev
            - ls
            - cp
    helm:
      values:
        controller:
          service:
            annotations:
              metallb.io/address-pool: ingress-lhn
