---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexus-repo-license
  namespace: nexus
spec:
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: nexus-repo-license.lic
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: nexus-pro-license
      rewrite:
        - regexp:
            source: .*\.lic$
            target: nexus-repo-license.lic
