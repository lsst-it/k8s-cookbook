---
# nxrm-ha mounts the secret named secret.license.name and reads the key with the
# same name, so both must be nexus-repo-license.lic. The rewrite maps whatever
# .lic file is attached to the 1Password item to that key (keep only one there).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexus-repo-license
  namespace: nexus
spec:
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: nexus-repo-license.lic
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: nexus-pro-license
      rewrite:
        - regexp:
            source: .*\.lic$
            target: nexus-repo-license.lic
