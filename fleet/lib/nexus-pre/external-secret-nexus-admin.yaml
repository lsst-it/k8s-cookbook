---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nxrm-ha-adminsecret
  namespace: nexus
spec:
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: nxrm-ha-adminsecret
    creationPolicy: Owner
  data:
    - secretKey: nexus-admin-password
      remoteRef:
        key: nexus-admin
        property: password
