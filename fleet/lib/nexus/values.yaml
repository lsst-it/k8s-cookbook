---
# Sonatype nxrm-ha chart: https://github.com/sonatype/nxrm3-ha-repository

namespaces:
  nexusNs:
    enabled: false
    name: nexus

statefulset:
  # single instance (Pro license + external PostgreSQL), not an HA cluster
  clustered: false
  container:
    resources:
      requests:
        cpu: "4"
        memory: 16Gi
      limits:
        cpu: "4"
        memory: 16Gi
    env:
      nexusDBPort: 5432
      install4jAddVmParams: -Xms4g -Xmx4g -XX:MaxDirectMemorySize=4g
    # required when secret.existingDbSecret.enabled is true
    additionalEnv:
      - name: DB_NAME
        value: nexus
      - name: DB_HOST
        value: nexus-pg-rw.nexus-pg.svc.cluster.local
      - name: DB_USER
        valueFrom:
          secretKeyRef:
            name: nexus-pg-creds
            key: username
      - name: DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: nexus-pg-creds
            key: password

secret:
  existingDbSecret:
    enabled: true
  license:
    name: nexus-repo-license.lic
    existingSecret: true

pvc:
  existingClaim: data-nexus-nexus3-0

service:
  nexus:
    enabled: true
    type: ClusterIP
    port: 8081
    targetPort: 8081

ingress:
  enabled: true
  ingressClassName: nginx
  host: nexus.${ .ClusterLabels.site }.lsst.org
  defaultRule: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 10m
  tls:
    - secretName: nexus-dashboard-ingress-tls
      hosts:
        - nexus.${ .ClusterLabels.site }.lsst.org
