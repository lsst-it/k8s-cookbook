---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-nexus-nexus3-0
  annotations:
    # rook-ceph-block reclaimPolicy is Delete: never let helm delete this PVC
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: rook-ceph-block
  volumeMode: Filesystem
  resources:
    requests:
      storage: 10Gi
