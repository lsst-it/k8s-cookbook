---
defaultNamespace: nexus
namespaceLabels:
  lsst.io/discover: "true"
  k8up-enabled: "true"
labels:
  bundle: &name nexus
kustomize:
  dir: kustomize/base
helm:
  chart: nxrm-ha
  releaseName: *name
  repo: https://sonatype.github.io/helm3-charts
  version: 98.2.0
  timeoutSeconds: 60
  waitForJobs: true
  # adopt the pre-existing PVC declared in kustomize/ (created by the old chart)
  takeOwnership: true
  valuesFiles:
    - values.yaml
dependsOn:
  - selector:
      matchLabels:
        bundle: cert-manager-crds
  - selector:
      matchLabels:
        bundle: nexus-pre
targetCustomizations:
  - name: yepun
    clusterSelector:
      matchExpressions:
        - key: management.cattle.io/cluster-display-name
          operator: In
          values:
            - yepun
    kustomize:
      dir: kustomize/overlays/yepun
