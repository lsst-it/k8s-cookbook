---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-stat-snapshot
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: snapshot
              image: docker.io/lsstit/cnpgsphere:17.5
              env:
                - name: PGHOST
                  value: cnpg-cluster-rw
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: cnpg-cluster-superuser
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: cnpg-cluster-superuser
                      key: password
                - name: PGDATABASE
                  value: butler
              command:
                - /bin/sh
                - -c
                - |
                  psql -v ON_ERROR_STOP=1 <<'SQL'
                  CREATE TABLE IF NOT EXISTS pg_stat_statements_snap AS
                  SELECT now() AS ts, *
                  FROM pg_stat_statements
                  WHERE false;

                  CREATE INDEX IF NOT EXISTS pg_stat_statements_snap_ts
                  ON pg_stat_statements_snap(ts);

                  INSERT INTO pg_stat_statements_snap
                  SELECT now(), *
                  FROM pg_stat_statements
                  WHERE calls > 0 AND query !~ '^(DECLARE|FETCH|CLOSE) ';

                  DELETE FROM pg_stat_statements_snap WHERE ts < now() - interval '30 days';

                  SELECT pg_stat_statements_reset();
                  SQL
