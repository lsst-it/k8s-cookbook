apiVersion: v1
kind: Service
metadata:
  name: cnpg-loadbalancer-dev
  namespace: cloudnativepg
  labels:
    cnpg.io/cluster: cnpg-cluster-dev
  annotations:
    metallb.io/loadBalancerIPs: 139.229.134.187
spec:
  type: LoadBalancer
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
  selector:
    cnpg.io/cluster: cnpg-cluster-dev
    cnpg.io/instanceRole: primary
