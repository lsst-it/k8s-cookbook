---
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: &name rubintv
  namespace: rook-ceph
  labels:
    bucket-notification-lsst.s3.rubin.tv: lsst.s3.rubin.tv
spec:
  bucketName: *name
  storageClassName: lfa
  additionalConfig:
    bucketOwner: rubintv
    bucketMaxSize: 1Ti
    bucketLifecycle: |
      {
        "Rules": [
          {
            "ID": "AbortIncompleteMultipartUploads",
            "Status": "Enabled",
            "Prefix": "",
            "AbortIncompleteMultipartUpload": {
              "DaysAfterInitiation": 1
            }
          }
        ]
      }
---
apiVersion: ceph.rook.io/v1
kind: CephBucketNotification
metadata:
  name: lsst.s3.rubin.tv
  namespace: rook-ceph
spec:
  topic: lsst.s3.rubin.tv
  events:
    - s3:ObjectCreated:*
    - s3:ObjectRemoved:*
