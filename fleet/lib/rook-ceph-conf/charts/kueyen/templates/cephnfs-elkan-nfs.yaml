---
apiVersion: ceph.rook.io/v1
kind: CephNFS
metadata:
  name: elkan-nfs
  namespace: rook-ceph
spec:
  server:
    active: 1
    resources:
      limits:
        cpu: "2"
        memory: 4Gi
      requests:
        cpu: "1"
        memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: rook-ceph-nfs
    ceph_daemon_type: nfs
    ceph_nfs: elkan-nfs
    instance: a
    rook_cluster: rook-ceph
  name: rook-ceph-nfs-elkan-nfs
  namespace: rook-ceph
  annotations:
    metallb.io/loadBalancerIPs: 139.229.134.82
spec:
  ports:
    - name: nfs
      port: 2049
      protocol: TCP
      targetPort: 2049
  selector:
    app: rook-ceph-nfs
    ceph_daemon_type: nfs
    ceph_nfs: elkan-nfs
    instance: a
    rook_cluster: rook-ceph
  type: LoadBalancer
