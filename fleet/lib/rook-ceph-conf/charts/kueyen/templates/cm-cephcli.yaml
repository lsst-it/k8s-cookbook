---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cephcli
  namespace: rook-ceph
data:
  script: |
    ceph mgr module enable nfs
    ceph orch set backend ""
    ceph mgr module disable rook

    waitfornfs auxtel
    ceph nfs export rm auxtel /auxtel
    ceph nfs export create cephfs auxtel /auxtel auxtel

    ceph device monitoring on
    ceph config set global device_failure_prediction_mode local
    ceph telemetry on --license sharing-1-0

    ceph osd pool set .mgr nodelete true
    ceph osd pool set .mgr nosizechange true

    radosgw-admin zone modify --rgw-realm=elkan --rgw-zone=elkan-kueyen --master --read-only=false --sync-from-all=false >/dev/null
    radosgw-admin period update --commit --rgw-realm=elkan >/dev/null
