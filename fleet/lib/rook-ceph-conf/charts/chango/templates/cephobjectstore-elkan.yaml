---
apiVersion: ceph.rook.io/v1
kind: CephObjectRealm
metadata:
  name: elkan
  namespace: rook-ceph
spec:
  defaultRealm: true
  pull:
    endpoint: https://s3.elkan.kueyen.dev.lsst.org
---
apiVersion: ceph.rook.io/v1
kind: CephObjectZoneGroup
metadata:
  name: elkan
  namespace: rook-ceph
spec:
  realm: elkan
---
apiVersion: ceph.rook.io/v1
kind: CephObjectZone
metadata:
  name: elkan
  namespace: rook-ceph
spec:
  zoneGroup: elkan
  customEndpoints:
    - https://s3.chango.ls.lsst.org
---
apiVersion: ceph.rook.io/v1
kind: CephObjectStore
metadata:
  name: elkan
  namespace: rook-ceph
spec:
  preservePoolsOnDelete: true
  gateway:
    port: 80
    instances: 2
    resources:
      limits:
        cpu: "16"
        memory: 8Gi
      requests:
        cpu: "1"
        memory: 4Gi
  zone:
    name: elkan
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rook-ceph-rgw-elkan
  namespace: rook-ceph
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: 1024m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - &host s3.chango.ls.lsst.org
      secretName: rook-ceph-rgw-elkan-ingress-tls
  rules:
    - host: *host
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rook-ceph-rgw-elkan
                port:
                  number: 80
---
apiVersion: ceph.rook.io/v1
kind: CephBlockPool
metadata:
  name: elkan.rgw.control
  namespace: rook-ceph
spec:
  application: rgw
  failureDomain: host
  deviceClass: hdd
  parameters:
    nodelete: "true"
    nosizechange: "true"
    pg_autoscale_mode: "off"
    pg_num: "32"
  replicated:
    size: 3
---
apiVersion: ceph.rook.io/v1
kind: CephBlockPool
metadata:
