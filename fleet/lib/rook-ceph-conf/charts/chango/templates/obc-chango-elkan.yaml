---
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: &name elkan
  namespace: rook-ceph
spec:
  bucketName: *name
  storageClassName: elkan
  additionalConfig:
    bucketOwner: chango-elkan
    bucketMaxSize: 500Ti
    bucketLifecycle: |
      {
        "Rules": [
          {
            "ID": "AbortIncompleteMultipartUploads",
            "Status": "Enabled",
            "Prefix": "",
            "AbortIncompleteMultipartUpload": {
              "DaysAfterInitiation": 1
            }
          }
        ]
      }
