extraDeploy:
  - |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: sso-pipeline-roles
      namespace: netbox
    data:
      sso_pipeline_roles.py: |
        from django.conf import settings

        def set_role(response, user, backend, *args, **kwargs):
            client_id = getattr(settings, 'SOCIAL_AUTH_KEYCLOAK_KEY', None)
            staff_role = getattr(settings, 'SOCIAL_AUTH_STAFF_ROLE', 'staff')
            superuser_role = getattr(settings, 'SOCIAL_AUTH_SUPERUSER_ROLE', 'superuser')
            roles = []
            try:
                roles = response['resource_access'][client_id]['roles']
            except KeyError:
                pass
            user.is_staff = staff_role in roles
            user.is_superuser = superuser_role in roles
            user.save()

remoteAuth:
  enabled: true
  backends:
    - social_core.backends.keycloak.KeycloakOAuth2
  header: HTTP_REMOTE_USER
  userFirstName: HTTP_REMOTE_USER_FIRST_NAME
  userLastName: HTTP_REMOTE_USER_LAST_NAME
  userEmail: HTTP_REMOTE_USER_EMAIL
  autoCreateUser: true
  autoCreateGroups: false
  defaultGroups: []
  defaultPermissions: {}
  groupSyncEnabled: false
  groupHeader: HTTP_REMOTE_USER_GROUP
  superuserGroups: []
  superusers: []
  staffGroups: []
  staffUsers: []
  groupSeparator: "|"

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: netbox.${ .ClusterLabels.site }.lsst.org
      paths:
        - /
  tls:
    - hosts:
        - netbox.${ .ClusterLabels.site }.lsst.org
      secretName: netbox-ingress-tls
      

extraConfig:
  - secret:
      secretName: netbox-keycloak-client
  - values:
      SOCIAL_AUTH_JSONFIELD_ENABLED: true
      SOCIAL_AUTH_STAFF_ROLE: staff
      SOCIAL_AUTH_SUPERUSER_ROLE: superuser
      SOCIAL_AUTH_PIPELINE:
        - social_core.pipeline.social_auth.social_details
        - social_core.pipeline.social_auth.social_uid
        - social_core.pipeline.social_auth.social_user
        - social_core.pipeline.user.get_username
        - social_core.pipeline.social_auth.associate_by_email
        - social_core.pipeline.user.create_user
        - social_core.pipeline.social_auth.associate_user
        - netbox.authentication.user_default_groups_handler
        - social_core.pipeline.social_auth.load_extra_data
        - social_core.pipeline.user.user_details
        - netbox.sso_pipeline_roles.set_role

extraVolumes:
  - name: sso-pipeline-roles
    configMap:
      name: sso-pipeline-roles

extraVolumeMounts:
  - name: sso-pipeline-roles
    mountPath: /opt/netbox/netbox/netbox/sso_pipeline_roles.py
    subPath: sso_pipeline_roles.py
    readOnly: true

postgresql:
  enabled: false

superuser:
  existingSecret: netbox-superuser

externalDatabase:
  host: netbox-pg-rw.netbox-pg.svc.cluster.local
  port: 5432
  database: netbox
  username: netbox
  existingSecretName: netbox-pg
  existingSecretKey: password

valkey:
  auth:
    existingSecret: netbox-valkey
    existingSecretPasswordKey: valkey-password
