---
apiVersion: fleet.cattle.io/v1alpha1
kind: GitRepo
metadata:
  name: machi
  namespace: fleet-default
spec:
  repo: https://github.com/lsst-it/k8s-cookbook
  branch: production
  keepResources: true
  paths:
    - fleet/s/ls/c/machi/*
  targets:
    - name: machi
      clusterSelector:
        matchExpressions:
          - key: management.cattle.io/cluster-display-name
            operator: In
            values:
              - machi
  correctDrift:
    enabled: true
