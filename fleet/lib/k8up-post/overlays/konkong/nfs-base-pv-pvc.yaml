apiVersion: v1
kind: Namespace
metadata:
  name: nfs-backups
  labels:
    k8up-enabled: "true"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-nfs-auxtel
spec:
  capacity:
    storage: 2Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
  nfs:
    server: nfs-auxtel.ls.lsst.org
    path: /auxtel
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-nfs-auxtel
  namespace: nfs-backups
  labels:
    k8up.io/backup-target: "true"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Ti
  storageClassName: ""
  volumeName: pv-nfs-auxtel
---
